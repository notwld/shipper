<script>
    $(document).ready(function () {
        $('.js-example-basic-single, .js-example-basic-single-1').select2({
            placeholder: 'Search for a city or country',
            minimumInputLength: 2,
            ajax: {
                url: function(params) {
                    return `https://secure.geonames.org/searchJSON?q=${params.term}&maxRows=20&username=notwld`;
                },
                delay: 250,
                processResults: function (data) {
                    // Transform the data into Select2 format
                    return {
                        results: data.geonames.map(item => {
                            const locationText = `${item.name}, ${item.countryName}`;
                            return {
                                id: locationText,  // Use the location text as the value
                                text: locationText // Use the same text for display
                            };
                        })
                    };
                },
                cache: true
            }
        });
    });
</script>

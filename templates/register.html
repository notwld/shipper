{% extends "_layout.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<section class="pad-tb min-h">
   <div class="container">
      <div class="row a-center">
         <div class="col-md-6 text-center wow fadeIn">
            <div class="mb-3">
               <img src="/assets/frontend/images/regimg.png" alt="Create new trip illustration">
            </div>
            <div class="title mbtm30 text-center">
               <h2 class="text-t-none">Registration Page</h2>
            </div>
            <div>
               <img src="/assets/frontend/images/revs.png" alt="Reviewers illustration">
            </div>
         </div>
         <div class="col-md-6">
            <div class="formBox wow fadeInUp">
               <div class="row">
                  <div class="col-md-12">
                     <div class="title mbtm30 text-center">
                        <h2 class="text-t-none text-left">Create an account</h2>
                     </div>
                  </div>
                  <div class="col-md-12">
                     <div class="para mbtm30">
                        <p>Already have an account? <a href="/login">Sign in</a></p>
                     </div>
                  </div>
               </div>
               <div>
                  <form class="formField" action="/register" method="POST" id="signupForm">
                     <input type="hidden" name="name" id="name">
                     <div class="container">
                        <div class="row">
                           <div class="col-md-6">
                              <div class="form-floating mb-3">
                                 <input type="text" class="form-control" id="firstName" placeholder="First Name"
                                    required>
                                 <label for="firstName">First Name</label>
                              </div>
                           </div>
                           <div class="col-md-6">
                              <div class="form-floating mb-3">
                                 <input type="text" class="form-control" id="lastName" placeholder="Last Name" required>
                                 <label for="lastName">Last Name</label>
                              </div>
                           </div>
                           <div class="col-md-12">
                              <div class="form-floating mb-3">
                                 <input type="email" class="form-control" id="email" name="email" placeholder="Email"
                                    required>
                                 <label for="email">Email</label>
                              </div>
                           </div>
                           <div class="col-md-12">
                              <div class="form-floating mb-3">
                                 <input type="tel" class="form-control" id="phone" name="phone"
                                    placeholder="Phone Number" required>
                                 <label for="phone">Phone Number</label>
                              </div>
                           </div>
                           <div class="col-md-6">
                              <div class="form-floating mb-3 show_hide_password" id="">
                                 <input type="password" class="form-control" id="password" name="password"
                                    placeholder="Password" required>
                                 <a class="hideshow" href=""><i class="fa fa-eye-slash" aria-hidden="true"></i></a>
                                 <label for="password">Password</label>

                              </div>
                           </div>
                           <div class="col-md-6">
                              <div class="form-floating mb-5 show_hide_password">
                                 <input type="password" class="form-control" id="confirmPassword"
                                    name="password_confirmation" placeholder="Confirm Password" required>
                                 <a class="hideshow" href=""><i class="fa fa-eye-slash" aria-hidden="true"></i></a>
                                 <label for="confirmPassword">Confirm Password</label>
                              </div>
                           </div>
                           <div class="col-md-12">
                              <div class="form-check mb-4">
                                 <input class="form-check-input" type="checkbox" id="FieldsetCheck" required>
                                 <label class="form-check-label" for="FieldsetCheck">
                                    I agree with the <a href="/terms-and-conditions">Terms & Conditions</a>
                                 </label>
                              </div>
                           </div>
                           <div class="col-md-12">
                              <input type="submit" value="Continue">
                           </div>
                        </div>
                     </div>
                  </form>
               </div>
               <div class="disclaimer">
                  <p>By registering, you agree to the processing of your personal data by Salesforce as described in the
                     Privacy Statement.</p>
               </div>
            </div>
         </div>
      </div>
   </div>
</section>
<script>
   $('#signupForm').submit(function (e) {
      e.preventDefault();
      var name = $('#firstName').val() + " " + $('#lastName').val();
      $('#name').val(name);

      $(this).submit();
   });    
</script>
@
{% endblock %}

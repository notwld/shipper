<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>BEMYSHIPPER - Admin Login</title>
</head>

<body>
    <div class="flex justify-center items-center h-screen">
        <div class="w-96 bg-white p-6 rounded-lg shadow-lg">
            <img src="/assets/frontend/images/logo.png" alt="Logo" class="mx-auto">
            <h1 class="text-2xl font-semibold text-center my-6"> Admin Login</h1>
            {% with messages = get_flashed_messages(with_categories=True) %}
            {% if messages %}
            <div class="space-y-4">
                {% for category, message in messages %}
                <div
                    class="p-4 rounded-md text-white {% if category == 'danger' %}bg-red-500{% elif category == 'success' %}bg-green-500{% elif category == 'warning' %}bg-yellow-500{% else %}bg-blue-500{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}
            <form action="/admin" method="POST" class="mt-4">
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" name="email" id="email"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm focus:ring-2 focus:ring-offset-2"
                        required>

                </div>
                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" name="password" id="password"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm focus:ring-2 focus:ring-offset-2"
                        required>
                </div>
                <button type="submit" class="w-full bg-red-500 text-white p-3 rounded-md cursor-pointer">Login</button>
            </form>
        </div>
    </div>


</body>

</html>
